<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon budget</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1c2733;--mut:#6b7886;--line:#dde3ea;--inc:#1f9d6b;--exp:#e2572b;--sav:#2b6fdc;--env:#c58a1b}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e8eef4;--mut:#93a1b0;--line:#2a3643}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:1000px;margin:auto}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 12px;max-width:1000px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--sav);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:0 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card{margin-bottom:12px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi{border-top:4px solid var(--line)}.kpi.inc{border-top-color:var(--inc)}.kpi.exp{border-top-color:var(--exp)}.kpi.sav{border-top-color:var(--sav)}.kpi.env{border-top-color:var(--env)}
.kpi.inc b,.card.inc>h2{color:var(--inc)}.kpi.exp b,.card.exp>h2{color:var(--exp)}.kpi.sav b,.card.sav>h2{color:var(--sav)}.kpi.env b,.card.env>h2{color:var(--env)}
button.kpi.lnk{text-align:left;font:inherit;color:var(--ink);background:var(--card);cursor:pointer;width:100%}
button.kpi.lnk b{font-size:24px}button.kpi.lnk:active{transform:scale(.98)}button.kpi.lnk small::after{content:" ›"}
[id^=sec-]{scroll-margin-top:72px}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--sav)}100%{box-shadow:0 0 0 0 transparent}}.flash{animation:fl 1.4s ease-out}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
h2{font-size:16px;margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row input[type=number]{width:96px;text-align:right}
input,select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 8px;font:inherit;min-width:0}
.row.ok{opacity:.6}
.two{display:flex;gap:6px;align-items:center}.two.fx input{width:84px}
.fh{color:var(--mut);font-size:13px;border-bottom:0}.fh.fx span:nth-child(2){width:84px;text-align:right;margin-right:46px}.fh.fx span:nth-child(3){width:84px;text-align:right}
.pay{flex:none;width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:8px;cursor:pointer;font-size:16px;padding:0}
.pay.on{background:var(--inc);border-color:var(--inc);color:#fff}.pay:disabled{opacity:.35;cursor:default}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:5px}
.cat{margin:9px 0}.cat>div:first-child{display:flex;justify-content:space-between}
input.bud{width:100%;margin-top:5px;padding:5px 8px;font-size:13px}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.hl{background:var(--bg);border-radius:8px;padding:10px;margin-top:10px}
.chart{display:flex;align-items:flex-end;gap:4px;height:140px}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.chart i{display:block;margin-bottom:3px;border-radius:4px 4px 0 0;min-height:2px}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.add button,.addcat button.pri{background:var(--exp);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.sav .add button{background:var(--sav)}
.addcat{display:flex;gap:6px;margin-top:12px}.addcat input{flex:1;border-style:dashed}
.addcat button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);cursor:pointer;padding:2px 6px;font:inherit}
.cp{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer;margin-bottom:8px}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut)}
.card.sav details.ret>summary{color:var(--sav);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btns button.danger{color:var(--exp)}
input.ren{flex:1;min-width:0}.mv{display:flex;flex:none}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0}.chk input{width:auto}
</style>
</head>
<body>
<noscript><p style="padding:20px">Cette application nécessite JavaScript.</p></noscript>
<script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.innerHTML.trim())a.innerHTML='<div style="padding:16px;margin:16px;border:1px solid #e2572b;border-radius:12px;font:15px system-ui">L\'application n\'a pas pu démarrer.<br><small>'+String(e.message||e.error)+'</small></div>'});</script>
<header><h1 id="ttl">Mon budget</h1></header>
<nav id="nav" aria-label="Navigation"></nav>
<main id="app"></main>
<script>
// ───────── Stockage (navigateur) ─────────
let memOnly=false;
const store=(()=>{try{const t="__t";localStorage.setItem(t,"1");localStorage.removeItem(t);return localStorage}catch(e){memOnly=true;const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,x)=>{m[k]=String(x)},removeItem:k=>{delete m[k]}}}})();
const KEY="budget_app_v1";
const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MC=["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];
const GN={inc:"Revenus",fix:"Factures",env:"Dépenses",pot:"Enveloppes",sav:"Épargne"};
const DEF=()=>({title:"Mon budget",year:new Date().getFullYear(),carry:true,
 g:{inc:["Salaire","Autres revenus"],fix:["Loyer ou crédit","Électricité","Internet","Assurances"],env:["Courses","Transports","Loisirs","Santé","Divers"],pot:["Cadeaux"],sav:["Épargne de précaution","Projet"]},
 m:{},tx:[],ret:[],open:{},goals:[]});
function normalize(o){const d=DEF();if(!o||typeof o!=="object"||Array.isArray(o))return d;
 for(const k in d)if(o[k]==null)o[k]=d[k];
 if(typeof o.g!=="object")o.g=d.g;for(const k in d.g)if(!Array.isArray(o.g[k]))o.g[k]=[];
 ["tx","ret","goals"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});return o}
let S;try{S=normalize(JSON.parse(store.getItem(KEY)||"null"))}catch(e){S=DEF()}
const save=()=>{try{store.setItem(KEY,JSON.stringify(S))}catch(e){}};
// ───────── Outils ─────────
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=s=>String(s||"").replace(/[|<>"]/g,"").trim().slice(0,40);
const eur=x=>(+x||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const kE=x=>x>=1000?(x/1000).toFixed(x%1000?1:0).replace(".",",")+" k€":Math.round(x)+" €";
const pct=x=>(isFinite(x)?x*100:0).toFixed(1).replace(".",",")+" %";
const r2=x=>Math.round(x*100)/100;
const ALL=[...Array(12).keys()];
const pad=n=>String(n).padStart(2,"0");
const fmtD=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dflt=m=>{const d=new Date();return d.getFullYear()===S.year&&d.getMonth()===m?fmtD(d):S.year+"-"+pad(m+1)+"-01"};
const dRange=m=>`min="${S.year}-${pad(m+1)}-01" max="${S.year}-${pad(m+1)}-${pad(new Date(S.year,m+1,0).getDate())}"`;
const fdate=d=>d?d.slice(8)+"/"+d.slice(5,7):"—";
const M=m=>S.m[m]||(S.m[m]={});
const v=(m,k,n)=>+((S.m[m]||{})[k+"|"+n])||0;
const spent=(m,n)=>S.tx.filter(t=>t.m===m&&t.c===n).reduce((a,t)=>a+t.a,0);
const retN=(m,n)=>S.ret.filter(t=>t.m===m&&t.c===n).reduce((a,t)=>a+t.a,0);
const retM=m=>S.ret.filter(t=>t.m===m).reduce((a,t)=>a+t.a,0);
const op=(g,n)=>+(S.open[g+"|"+n])||0;
const sum=(m,g)=>S.g[g].reduce((a,n)=>a+(g==="env"?spent(m,n):v(m,g,n)),0);
const carry=m=>S.carry&&m>0?tot(m-1).r:0;
const tot=m=>{const i=sum(m,"inc"),f=sum(m,"fix"),e=sum(m,"env"),s=sum(m,"sav"),p=sum(m,"pot"),c=carry(m);return{i,f,e,d:f+e,s,p,c,r:i+c-f-e-s-p}};
const soldeSav=(m,n)=>op("sav",n)+ALL.slice(0,m+1).reduce((a,k)=>a+v(k,"sav",n)+v(k,"adjsav",n)-retN(k,n),0);
const soldePot=(m,n)=>op("pot",n)+ALL.slice(0,m+1).reduce((a,k)=>a+v(k,"pot",n)-spent(k,n)+v(k,"adjpot",n),0);
const totSolde=m=>S.g.sav.reduce((a,n)=>a+soldeSav(m,n),0);
const active=m=>{const t=tot(m);return !!(t.i||t.d||t.s||t.p)};
const lastMonth=()=>{for(let k=11;k>=0;k--)if(active(k))return k;const d=new Date();return d.getFullYear()===S.year?d.getMonth():0};
const inp=(m,k,n,val)=>`<input type="number" inputmode="decimal" step="0.01" value="${val||""}" placeholder="0" data-m="${m}" data-k="${k}" data-n="${esc(n)}" aria-label="${esc(n)}">`;
const lineForm=g=>`<form class="addcat" data-form="addline" data-g="${g}"><input name="n" placeholder="Nouvelle ligne" maxlength="40" required aria-label="Nouvelle ligne ${GN[g]}"><button>+ Ajouter</button></form>`;
const none=g=>S.g[g].length?"":`<p class="note">Aucune ligne : ajoutez-en une ci-dessous.</p>`;
// ───────── Navigation ─────────
const now=new Date();
let cur=now.getFullYear()===S.year?now.getMonth():(now.getFullYear()<S.year?0:"an");
function nav(){document.getElementById("nav").innerHTML=MC.map((m,i)=>`<button data-act="go" data-v="${i}" class="${cur===i?"on":""}">${m}</button>`).join("")+
 [["an","Vue annuelle"],["obj","Objectifs"],["set","⚙ Réglages"]].map(([k,l])=>`<button data-act="go" data-v="${k}" class="${cur===k?"on":""}">${l}</button>`).join("")}
function nav2(){const n=document.getElementById("nav"),a=n&&n.querySelector(".on");if(a)n.scrollLeft=a.offsetLeft-(n.clientWidth-a.clientWidth)/2}
function go(x){cur=x;nav();nav2();draw();scrollTo(0,0)}
function goSec(id){const e=document.getElementById("sec-"+id);if(!e)return;e.scrollIntoView({behavior:"smooth",block:"start"});e.classList.remove("flash");void e.offsetWidth;e.classList.add("flash")}
function draw(){const y=scrollY,app=document.getElementById("app");
 const op=[...app.querySelectorAll("details[open][data-id]")].map(x=>x.dataset.id);
 app.innerHTML=cur==="an"?year():cur==="obj"?goalsPage():cur==="set"?settings():month(cur);
 op.forEach(id=>{const e=app.querySelector('details[data-id="'+CSS.escape(id)+'"]');if(e)e.open=true});
 document.getElementById("ttl").textContent=S.title;document.title=S.title;scrollTo(0,y)}
// ───────── Vue d'un mois ─────────
function kpis(T,link){const k=(c,id,h)=>link?`<button type="button" class="kpi lnk ${c}" data-act="sec" data-id="${id}">${h}</button>`:`<div class="kpi ${c}">${h}</div>`;
 return`<div class="kpis">${k("inc","inc",`<small>Revenus</small><b>${eur(T.i)}</b>`)}${k("exp","env",`<small>Dépenses</small><b>${eur(T.d)}</b>`)}${k("sav","sav",`<small>Épargne · ${pct(T.i?T.s/T.i:0)}</small><b>${eur(T.s)}</b>`)}${k("env","pot",`<small>Enveloppes versées</small><b>${eur(T.p)}</b>`)}<div class="kpi"><small>Reste${T.c?" (report inclus)":""}</small><b>${eur(T.r)}</b></div></div>`}
function month(m){const T=tot(m);
 const hello=!Object.keys(S.m).length&&!S.tx.length?`<div class="hl" style="margin:0 0 12px">👋 <b>Bienvenue !</b> Adaptez d'abord vos lignes dans <b>⚙ Réglages</b> (renommer, supprimer, ajouter), puis saisissez vos revenus, factures et dépenses. Pensez à exporter vos données de temps en temps.</div>`:"";
 return hello+kpis(T,true)+incCard(m)+fixCard(m)+envCard(m)+potCard(m)+savCard(m)+posteCard([m],"Dépenses par poste")}
const incCard=m=>`<div id="sec-inc" class="card inc"><h2>Revenus · ${eur(sum(m,"inc"))}</h2>${S.carry&&m>0?`<div class="row"><span>Report du mois précédent</span><b>${eur(carry(m))}</b></div>`:""}${S.g.inc.map(n=>`<label class="row"><span>${esc(n)}</span>${inp(m,"inc",n,v(m,"inc",n))}</label>`).join("")}${none("inc")}${lineForm("inc")}</div>`;
const pre=(m,n)=>v(m,"pre",n);
const fixPre=m=>S.g.fix.reduce((a,n)=>a+pre(m,n),0);
const fixRest=m=>S.g.fix.reduce((a,n)=>a+Math.max(pre(m,n)-v(m,"fix",n),0),0);
function fixCard(m){
 return`<div id="sec-fix" class="card exp"><h2>Factures · ${eur(sum(m,"fix"))} payées</h2>
 <div class="kpis"><div class="kpi"><small>Prévu</small><b>${eur(fixPre(m))}</b></div><div class="kpi exp"><small>Payé</small><b>${eur(sum(m,"fix"))}</b></div><div class="kpi"><small>Reste à sortir</small><b>${eur(fixRest(m))}</b></div></div>
 ${m>0?`<button type="button" class="cp" data-act="copyprev" data-m="${m}">Copier les prévus de ${MOIS[m-1].toLowerCase()}</button>`:""}
 <div class="row fh fx"><span>Facture</span><span>Prévu</span><span>Payé</span></div>
 ${S.g.fix.map(n=>{const p=pre(m,n),r=v(m,"fix",n),ok=p>0&&r>=p;return`<div class="row${ok?" ok":""}"><span>${ok?"✓ ":""}${esc(n)}</span><span class="two fx">${inp(m,"pre",n,p)}<button type="button" class="pay${ok?" on":""}" data-act="pay" data-m="${m}" data-n="${esc(n)}" title="${ok?"Annuler le paiement":"Valider le montant prévu"}" aria-label="${ok?"Annuler le paiement de":"Valider le prévu de"} ${esc(n)}"${p>0?"":" disabled"}>✓</button>${inp(m,"fix",n,r)}</span></div>`}).join("")}${none("fix")}${lineForm("fix")}</div>`}
function envCard(m){
 const list=S.tx.map((t,i)=>[t,i]).filter(([t])=>t.m===m).sort((a,b)=>(b[0].d||"").localeCompare(a[0].d||""));
 const opt=g=>S.g[g].map(n=>`<option>${esc(n)}</option>`).join("");
 const bars=S.g.env.map(n=>{const a=spent(m,n),b=v(m,"bud",n),p=b?Math.min(a/b,1)*100:0;return`<div class="cat"><div><span>${esc(n)}</span><span>${eur(a)}${b?" / "+eur(b):""}</span></div>${b?`<div class="bar"><i style="width:${p}%;background:${a>b?"var(--exp)":"var(--inc)"}"></i></div>`:""}<input class="bud" type="number" inputmode="decimal" step="0.01" placeholder="Budget" value="${b||""}" data-m="${m}" data-k="bud" data-n="${esc(n)}" aria-label="Budget ${esc(n)}"></div>`}).join("");
 return`<div id="sec-env" class="card exp"><h2>Dépenses du mois · ${eur(sum(m,"env"))}</h2>
 ${S.g.env.length+S.g.pot.length?`<form class="add" data-form="addtx" data-m="${m}"><input type="date" name="d" value="${dflt(m)}" ${dRange(m)} required><select name="c" aria-label="Catégorie">${S.g.env.length?`<optgroup label="Dépenses">${opt("env")}</optgroup>`:""}${S.g.pot.length?`<optgroup label="Enveloppes">${opt("pot")}</optgroup>`:""}</select><input type="number" name="a" inputmode="decimal" step="0.01" min="0.01" placeholder="Montant" required><input name="n" placeholder="Note"><button>Ajouter</button></form>`:`<p class="note">Ajoutez d'abord une ligne de dépenses.</p>`}
 ${list.length?list.map(([t,i])=>`<div class="row"><span>${fdate(t.d)} · <b>${esc(t.c)}</b>${t.n?" · "+esc(t.n):""}</span><span>${eur(t.a)} <button class="x" data-act="deltx" data-i="${i}" aria-label="Supprimer">✕</button></span></div>`).join(""):`<p class="note">Aucune dépense saisie ce mois-ci.</p>`}
 <h2 style="margin-top:16px">Budgets (facultatif)</h2><div class="grid">${bars}</div>${none("env")}${lineForm("env")}</div>`}
const openBlock=(g)=>`<details data-id="open-${g}"><summary>Soldes de départ (avant janvier)</summary>${S.g[g].map(n=>`<label class="row"><span>${esc(n)}</span><input type="number" inputmode="decimal" step="0.01" value="${op(g,n)||""}" placeholder="0" data-open="${g}|${esc(n)}" aria-label="Solde de départ ${esc(n)}"></label>`).join("")}<p class="note">Montant déjà présent avant le début de l'année.</p></details>`;
const adjBlock=(m,g)=>`<details data-id="adj-${g}-${m}"><summary>Ajustements du mois</summary>${S.g[g].map(n=>`<label class="row"><span>${esc(n)}</span>${inp(m,"adj"+g,n,v(m,"adj"+g,n))}</label>`).join("")}<p class="note">Montant en + ou − qui corrige le solde (intérêts, frais…).</p></details>`;
function potCard(m){
 return`<div id="sec-pot" class="card env"><h2>Enveloppes · ${eur(sum(m,"pot"))} versés</h2><p class="note" style="margin:0 0 6px">Saisissez le montant versé, puis ajoutez les dépenses de l'enveloppe dans « Dépenses du mois ». Elles ne comptent pas dans les dépenses.</p>
 <div class="row fh"><span>Enveloppe</span><span>Versé · Solde</span></div>
 ${S.g.pot.map(n=>`<div class="row"><span>${esc(n)}<br><small class="note">dépensé ${eur(spent(m,n))}</small></span><span class="two">${inp(m,"pot",n,v(m,"pot",n))}<b style="width:96px;text-align:right">${eur(soldePot(m,n))}</b></span></div>`).join("")}${none("pot")}
 ${adjBlock(m,"pot")}${openBlock("pot")}${lineForm("pot")}</div>`}
function savCard(m){
 const rl=S.ret.map((t,i)=>[t,i]).filter(([t])=>t.m===m);
 return`<div id="sec-sav" class="card sav"><h2>Épargne · ${eur(sum(m,"sav"))} versés</h2>
 <div class="row fh"><span>Ligne</span><span>Versé · Solde</span></div>
 ${S.g.sav.map(n=>`<div class="row"><span>${esc(n)}</span><span class="two">${inp(m,"sav",n,v(m,"sav",n))}<b style="width:96px;text-align:right">${eur(soldeSav(m,n))}</b></span></div>`).join("")}${none("sav")}
 <div class="row hl" style="padding:8px 10px;border-radius:8px"><span><b>Solde total</b></span><b>${eur(totSolde(m))}</b></div>
 ${S.g.sav.length?`<details class="ret" data-id="ret-${m}"${rl.length?" open":""}><summary>− Retrait d'épargne${rl.length?" · "+eur(retM(m)):""}</summary><form class="add" data-form="addret" data-m="${m}"><input type="date" name="d" value="${dflt(m)}" ${dRange(m)} required><select name="c" aria-label="Ligne">${S.g.sav.map(n=>`<option>${esc(n)}</option>`).join("")}</select><input type="number" name="a" inputmode="decimal" step="0.01" min="0.01" placeholder="Montant" required><input name="n" placeholder="Motif"><button>Retirer</button></form>${rl.map(([t,i])=>`<div class="row"><span>${fdate(t.d)} · <b>${esc(t.c)}</b>${t.n?" · "+esc(t.n):""}</span><span>−${eur(t.a)} <button class="x" data-act="delret" data-i="${i}" aria-label="Supprimer">✕</button></span></div>`).join("")}</details>`:""}
 <p class="note">Solde = solde du mois précédent + versé + ajustements − retraits.</p>
 ${adjBlock(m,"sav")}${openBlock("sav")}${lineForm("sav")}</div>`}
function posteCard(ms,title){
 const rows=[...S.g.fix.map(n=>["fix",n]),...S.g.env.map(n=>["env",n])].map(([g,n])=>[n,ms.reduce((a,m)=>a+(g==="env"?spent(m,n):v(m,g,n)),0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 const t=rows.reduce((a,x)=>a+x[1],0);
 return`<div class="card exp"><h2>${title}</h2>${t?rows.slice(0,10).map(([n,a])=>`<div class="cat"><div><span>${esc(n)}</span><span>${eur(a)} · ${pct(a/t)}</span></div><div class="bar"><i style="width:${a/rows[0][1]*100}%;background:var(--exp)"></i></div></div>`).join("")+`<div class="hl">Poste le plus important : <b>${esc(rows[0][0])}</b> (${eur(rows[0][1])}, ${pct(rows[0][1]/t)})</div>`:`<p class="note">Aucune dépense pour le moment.</p>`}</div>`}
// ───────── Vue annuelle ─────────
function year(){
 const T=ALL.map(tot),Sx=k=>T.reduce((a,t)=>a+t[k],0),nm=Math.max(1,ALL.filter(active).length);
 const i=Sx("i"),d=Sx("d"),s=Sx("s"),p=Sx("p"),R=ALL.reduce((a,k)=>a+retM(k),0),L=lastMonth();
 const fx=ALL.reduce((a,k)=>a+fixPre(k),0),fp=ALL.reduce((a,k)=>a+sum(k,"fix"),0),fr=ALL.reduce((a,k)=>a+fixRest(k),0);
 const mx=Math.max(1,...T.map(t=>t.i),...T.map(t=>t.d)),cu=ALL.map(totSolde),cm=Math.max(1,...cu);
 const ch=(f,col,mxv)=>`<div class="chart">${ALL.map(k=>`<div><i style="height:${Math.max(0,f(k))/mxv*110}px;background:${col}"></i>${MOIS[k][0]}</div>`).join("")}</div>`;
 return`<h2 style="margin:0 0 10px">${S.year}</h2>
 <div class="kpis"><div class="kpi inc"><small>Revenus</small><b>${eur(i)}</b></div><div class="kpi exp"><small>Dépenses</small><b>${eur(d)}</b></div><div class="kpi sav"><small>Épargne versée · ${pct(i?s/i:0)}</small><b>${eur(s)}</b></div><div class="kpi env"><small>Enveloppes versées</small><b>${eur(p)}</b></div><div class="kpi"><small>Reste (hors report)</small><b>${eur(i-d-s-p)}</b></div></div>
 <div class="kpis"><div class="kpi inc"><small>Revenu moyen / mois</small><b>${eur(i/nm)}</b></div><div class="kpi exp"><small>Dépenses moy. / mois</small><b>${eur(d/nm)}</b></div><div class="kpi sav"><small>Épargne moy. / mois</small><b>${eur(s/nm)}</b></div></div>
 <div class="kpis"><div class="kpi"><small>Factures prévues</small><b>${eur(fx)}</b></div><div class="kpi exp"><small>Factures payées</small><b>${eur(fp)}</b></div><div class="kpi"><small>Reste à sortir</small><b>${eur(fr)}</b></div></div>
 <div class="kpis"><div class="kpi sav"><small>Retraits d'épargne</small><b>${eur(R)}</b></div><div class="kpi sav"><small>Épargne nette (versé − retraits)</small><b>${eur(s-R)}</b></div><div class="kpi sav"><small>Solde total fin ${MOIS[L].toLowerCase()}</small><b>${eur(totSolde(L))}</b></div></div>
 <div class="grid">${posteCard(ALL,"Dépenses par poste (année)")}<div class="card"><h2>Revenus et dépenses par mois</h2>${ch(k=>T[k].i,"var(--inc)",mx)}${ch(k=>T[k].d,"var(--exp)",mx)}</div><div class="card sav"><h2>Solde total de l'épargne</h2>${ch(k=>cu[k],"var(--sav)",cm)}</div></div>`}
// ───────── Objectifs ─────────
function goalChart(g,L,sol,proj){
 const E=Math.max(L+1,(g.y*12+g.m)-S.year*12),W=340,H=170,pl=44,pr=14,pt=14,pb=26;
 const pts=ALL.slice(0,L+1).map(k=>[k,g.lines.reduce((a,n)=>a+soldeSav(k,n),0)]);
 const ymax=Math.max(g.t,proj,...pts.map(q=>q[1]),1)*1.08;
 const X=k=>pl+k/E*(W-pl-pr),Y=y=>pt+(1-y/ymax)*(H-pt-pb);
 const line=a=>a.map((q,i)=>(i?"L":"M")+X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1)).join("");
 const tk=[0,ymax/2,ymax].map(y=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" style="stroke:var(--line)"/><text x="${pl-4}" y="${(Y(y)+3).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--mut)">${kE(y)}</text>`).join("");
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution ${esc(g.name)}">${tk}
 <line x1="${pl}" x2="${W-pr}" y1="${Y(g.t).toFixed(1)}" y2="${Y(g.t).toFixed(1)}" stroke-dasharray="2 3" style="stroke:var(--inc)"/>
 <path d="${line([[L,sol],[E,proj]])}" fill="none" stroke-dasharray="1 4" stroke-width="2" stroke-linecap="round" style="stroke:var(--mut)"/>
 <path d="${line([[L,sol],[E,g.t]])}" fill="none" stroke-dasharray="6 4" stroke-width="2" style="stroke:var(--exp)"/>
 <path d="${line(pts)}" fill="none" stroke-width="2.5" style="stroke:var(--sav)"/>
 <circle cx="${X(E).toFixed(1)}" cy="${Y(g.t).toFixed(1)}" r="4" style="fill:var(--inc)"/>
 <text x="${pl}" y="${H-8}" font-size="9" style="fill:var(--mut)">janv. ${S.year}</text>
 <text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="9" style="fill:var(--mut)">${MC[g.m].toLowerCase()} ${g.y}</text></svg>`}
function goalForm(g){const id=g?g.id:"new",sel=g?g.lines:[],ym=g?g.y+"-"+pad(g.m+1):(S.year+1)+"-"+pad(12);
 return`<form data-form="goal" data-id="${id}"><label class="row"><span>Nom</span><input name="name" value="${g?esc(g.name):""}" maxlength="40" required style="width:60%"></label>
 <label class="row"><span>Montant visé (€)</span><input type="number" name="t" step="0.01" min="0.01" value="${g?g.t:""}" required></label>
 <label class="row"><span>Échéance</span><input type="month" name="month" value="${ym}" required></label>
 <div style="margin-top:6px"><small class="note">Lignes d'épargne concernées :</small>${S.g.sav.map(n=>`<label class="chk"><input type="checkbox" name="l" value="${esc(n)}"${sel.includes(n)?" checked":""}>${esc(n)}</label>`).join("")||'<p class="note">Ajoutez d\'abord une ligne d\'épargne (Réglages).</p>'}</div>
 <div class="btns"><button class="pri" style="background:var(--sav);color:#fff;border:0">${g?"Enregistrer":"Créer l'objectif"}</button>${g?`<button type="button" class="danger" data-act="delgoal" data-id="${g.id}">Supprimer</button>`:""}</div></form>`}
function goalsPage(){
 const L=lastMonth();
 const cards=S.goals.map(g=>{
  const sol=g.lines.reduce((a,n)=>a+soldeSav(L,n),0),miss=Math.max(0,g.t-sol),left=Math.max(0,(g.y*12+g.m)-(S.year*12+L));
  const vs=ALL.slice(0,L+1).reduce((a,k)=>a+g.lines.reduce((b,n)=>b+v(k,"sav",n),0),0);
  const sol0=g.lines.reduce((a,n)=>a+soldeSav(0,n),0);
  const byProg=vs===0&&L>0,avg=byProg?(sol-sol0)/L:vs/(L+1);
  const need=left>0?miss/left:miss,proj=sol+avg*left,done=miss===0,ok=avg>=need,when=MOIS[g.m].toLowerCase()+" "+g.y;
  return`<div class="card sav"><h2>${esc(g.name)} · ${eur(g.t)} pour ${when}</h2>
  ${g.lines.length?"":`<p class="note">Aucune ligne d'épargne liée : ouvrez « Modifier l'objectif ».</p>`}
  <div class="kpis"><div class="kpi sav"><small>Solde actuel</small><b>${eur(sol)}</b></div><div class="kpi exp"><small>Il manque</small><b>${eur(miss)}</b></div><div class="kpi"><small>À mettre / mois (${left} mois)</small><b>${eur(need)}</b></div><div class="kpi"><small>${byProg?"Progression moyenne / mois":"Moyenne mise / mois"}</small><b>${eur(avg)}</b></div></div>
  <div class="hl">${done?"Objectif atteint 🎉":`${ok?"Rythme suffisant":"Rythme insuffisant : il manque "+eur(need-avg)+" par mois"} · estimation à ${when} : <b>${eur(proj)}</b>`}</div>
  ${goalChart(g,L,sol,proj)}
  <p class="note"><span style="color:var(--sav)">━</span> évolution réelle · <span style="color:var(--exp)">╍</span> chemin à suivre · <span style="color:var(--mut)">┈</span> au rythme moyen · <span style="color:var(--inc)">┄</span> objectif</p>
  <details data-id="goal-${g.id}"><summary>Modifier l'objectif</summary>${goalForm(g)}</details></div>`}).join("");
 return`<p class="note" style="margin-top:0">${S.goals.length?`Calculé à partir du solde de fin ${MOIS[lastMonth()].toLowerCase()} ${S.year} (dernier mois saisi).`:"Fixez un montant à atteindre et une date : l'application calcule ce qu'il manque et ce qu'il faut mettre chaque mois."}</p>
 <div class="card sav"><details data-id="goal-new"${S.goals.length?"":" open"}><summary style="color:var(--sav);font-weight:600">＋ Nouvel objectif</summary>${goalForm(null)}</details></div>
 <div class="grid">${cards}</div>`}
// ───────── Réglages ─────────
function settings(){
 const grp=g=>`<div class="card"><h2>${GN[g]}</h2>${S.g[g].map((n,i)=>`<div class="row"><input class="ren" value="${esc(n)}" data-ren="${esc(n)}" data-g="${g}" maxlength="40" aria-label="Renommer ${esc(n)}"><span class="mv"><button class="x" data-act="up" data-g="${g}" data-i="${i}" aria-label="Monter">▲</button><button class="x" data-act="down" data-g="${g}" data-i="${i}" aria-label="Descendre">▼</button><button class="x" data-act="delline" data-g="${g}" data-n="${esc(n)}" aria-label="Supprimer">✕</button></span></div>`).join("")}${none(g)}${lineForm(g)}</div>`;
 return`<div class="card"><h2>Général</h2>
 <label class="row"><span>Titre</span><input value="${esc(S.title)}" data-set="title" maxlength="30" style="width:60%"></label>
 <label class="row"><span>Année</span><input type="number" value="${S.year}" data-set="year" min="2000" max="2100" style="width:96px"></label>
 <label class="chk" style="padding:8px 0 0"><input type="checkbox" data-set="carry"${S.carry?" checked":""}> Reporter automatiquement le reste du mois précédent</label></div>
 <p class="note" style="margin:0 0 10px">Renommez une ligne en modifiant son nom, changez l'ordre avec ▲▼, supprimez avec ✕ (ses montants sont alors supprimés). Les noms doivent être différents.</p>
 <div class="grid">${["inc","fix","env","pot","sav"].map(grp).join("")}</div>
 <div class="card"><h2>Mes données</h2><p class="note" style="margin-top:0">Vos données restent dans ce navigateur, sur cet appareil. Exportez-les pour les sauvegarder ou les transférer sur un autre appareil.</p>
 <div class="btns"><button data-act="exp">Exporter (JSON)</button><button data-act="imp">Importer (JSON)</button><button class="danger" data-act="wipe">Tout effacer</button></div>
 <input id="imp" type="file" accept=".json,application/json" hidden></div>`}
// ───────── Actions ─────────
const exists=n=>S.g.inc.concat(S.g.fix,S.g.env,S.g.pot,S.g.sav).some(x=>x.toLowerCase()===n.toLowerCase());
function addLine(g,raw){const n=clean(raw);if(!n)return;if(exists(n)){alert("Ce nom existe déjà.");return}S.g[g].push(n);save();draw()}
function remap(fn){ // applique fn(ancienNom)->nouveauNom|null sur toutes les données liées à un nom de ligne
 const key=k=>{const i=k.indexOf("|");return[k.slice(0,i),k.slice(i+1)]};
 Object.keys(S.m).forEach(m=>{const o=S.m[m],out={};Object.keys(o).forEach(k=>{const[p,n]=key(k),r=fn(n);if(r!==null)out[p+"|"+r]=o[k]});S.m[m]=out});
 const oo={};Object.keys(S.open).forEach(k=>{const[p,n]=key(k),r=fn(n);if(r!==null)oo[p+"|"+r]=S.open[k]});S.open=oo;
 ["tx","ret"].forEach(t=>{S[t]=S[t].map(x=>{const r=fn(x.c);return r===null?null:Object.assign({},x,{c:r})}).filter(Boolean)});
 S.goals.forEach(g=>{g.lines=g.lines.map(fn).filter(x=>x!==null)})}
function renameLine(g,old,raw){const n=clean(raw),i=S.g[g].indexOf(old);if(!n||n===old||i<0){draw();return}
 if(exists(n)&&n.toLowerCase()!==old.toLowerCase()){alert("Ce nom existe déjà.");draw();return}
 S.g[g][i]=n;remap(x=>x===old?n:x);save();draw()}
function delLine(g,n){if(!confirm("Supprimer « "+n+" » et tous ses montants saisis ?"))return;S.g[g]=S.g[g].filter(x=>x!==n);remap(x=>x===n?null:x);save();draw()}
function moveLine(g,i,d){const a=S.g[g],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();draw()}
function saveGoal(id,f){const fd=new FormData(f),p=String(fd.get("month")||"").split("-");if(p.length<2)return;
 const g={id:id==="new"?String(Date.now()):id,name:clean(fd.get("name"))||"Objectif",t:+fd.get("t")||0,y:+p[0],m:+p[1]-1,lines:fd.getAll("l")};
 const i=S.goals.findIndex(x=>x.id===id);if(i>=0)S.goals[i]=g;else S.goals.push(g);save();draw()}
function exportJson(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="budget-"+S.year+".json";a.click()}
function importJson(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=="object"||!o.g||!o.m)throw 0;if(!confirm("Remplacer les données actuelles par celles du fichier ?"))return;
  store.setItem(KEY,JSON.stringify(normalize(o)));location.reload()}catch(e){alert("Fichier invalide : choisissez un export JSON de cette application.")}};r.readAsText(f)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,a=d.act;
 if(a==="go")go(/^\d+$/.test(d.v)?+d.v:d.v);
 else if(a==="sec")goSec(d.id);
 else if(a==="pay"){const m=+d.m,p=pre(m,d.n),r=v(m,"fix",d.n);M(m)["fix|"+d.n]=p>0&&Math.abs(r-p)<.005?"":p;save();draw()}
 else if(a==="copyprev"){const m=+d.m;S.g.fix.forEach(n=>{const p=pre(m-1,n);if(p&&!pre(m,n))M(m)["pre|"+n]=p});save();draw()}
 else if(a==="deltx"){S.tx.splice(+d.i,1);save();draw()}
 else if(a==="delret"){S.ret.splice(+d.i,1);save();draw()}
 else if(a==="delline")delLine(d.g,d.n);
 else if(a==="up")moveLine(d.g,+d.i,-1);
 else if(a==="down")moveLine(d.g,+d.i,1);
 else if(a==="delgoal"){if(confirm("Supprimer cet objectif ?")){S.goals=S.goals.filter(x=>x.id!==d.id);save();draw()}}
 else if(a==="exp")exportJson();
 else if(a==="imp")document.getElementById("imp").click();
 else if(a==="wipe"){if(confirm("Effacer toutes vos données sur cet appareil ? Pensez à exporter d'abord.")){store.removeItem(KEY);location.reload()}}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset||{};
 if(t.id==="imp")importJson(t);
 else if(d.k!==undefined){M(+d.m)[d.k+"|"+d.n]=t.value;save();draw()}
 else if(d.open!==undefined){S.open[d.open]=t.value;save();draw()}
 else if(d.ren!==undefined)renameLine(d.g,d.ren,t.value);
 else if(d.set==="carry"){S.carry=t.checked;save();draw()}
 else if(d.set==="title"){S.title=clean(t.value)||"Mon budget";save();draw()}
 else if(d.set==="year"){S.year=Math.min(2100,Math.max(2000,+t.value||S.year));save();nav();draw()}});
document.addEventListener("submit",e=>{const f=e.target,d=f.dataset;if(!d||!d.form)return;e.preventDefault();const fd=new FormData(f);
 if(d.form==="addline")addLine(d.g,fd.get("n"));
 else if(d.form==="addtx"){S.tx.push({m:+d.m,d:fd.get("d"),c:fd.get("c"),a:+fd.get("a"),n:String(fd.get("n")||"").trim()});save();draw()}
 else if(d.form==="addret"){S.ret.push({m:+d.m,d:fd.get("d"),c:fd.get("c"),a:+fd.get("a"),n:String(fd.get("n")||"").trim()});save();draw()}
 else if(d.form==="goal")saveGoal(d.id,f)});
// ───────── Démarrage ─────────
nav();nav2();draw();
if(memOnly)document.getElementById("app").insertAdjacentHTML("afterbegin",'<div class="hl" style="margin-bottom:12px">Le stockage du navigateur est bloqué : vos saisies seront perdues à la fermeture. Ouvrez la page dans un onglet normal (hors navigation privée).</div>');
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
</body>
</html>
