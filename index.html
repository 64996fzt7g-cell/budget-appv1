// ───────── Actions ─────────
const exists=n=>S.g.inc.concat(S.g.fix,S.g.env,S.g.pot,S.g.sav).some(x=>x.toLowerCase()===n.toLowerCase());
function addLine(g,raw){const n=clean(raw);if(!n)return;if(exists(n)){alert(S.end[Object.keys(S.end).find(k=>k.toLowerCase()===n.toLowerCase())]?"Cette ligne existe dans les « Lignes retirées » : réactivez-la depuis Réglages.":"Ce nom existe déjà.");return}S.g[g].push(n);save();draw()}
function remap(fn){ // applique fn(ancienNom)->nouveauNom|null sur toutes les données liées à un nom de ligne, pour toutes les années
 const key=k=>{const i=k.indexOf("|");return[k.slice(0,i),k.slice(i+1)]};
 const yearPart=()=>{
  Object.keys(S.m).forEach(m=>{const o=S.m[m],out={};Object.keys(o).forEach(k=>{const[p,n]=key(k),r=fn(n);if(r!==null)out[p+"|"+r]=o[k]});S.m[m]=out});
  const oo={};Object.keys(S.open).forEach(k=>{const[p,n]=key(k),r=fn(n);if(r!==null)oo[p+"|"+r]=S.open[k]});S.open=oo;
  ["tx","ret"].forEach(t=>{S[t]=S[t].map(x=>{const r=fn(x.c);return r===null?null:Object.assign({},x,{c:r})}).filter(Boolean)});
  const a2={};Object.keys(S.ap||{}).forEach(k=>{const i=k.indexOf("|"),r=fn(k.slice(i+1));if(r!==null)a2[k.slice(0,i)+"|"+r]=S.ap[k]});S.ap=a2};
 const y0=S.year;stash();
 Object.keys(S.yrs).forEach(y=>{if(+y!==y0){loadYear(+y);yearPart();stash()}});
 loadYear(y0);yearPart();stash();
 S.goals.forEach(g=>{g.lines=g.lines.map(fn).filter(x=>x!==null)});S.nobal=(S.nobal||[]).map(fn).filter(x=>x!==null);
 {const e2={};Object.keys(S.end||{}).forEach(k=>{const r=fn(k);if(r!==null)e2[r]=S.end[k]});S.end=e2}
 {const d2={};Object.keys(S.due||{}).forEach(k=>{const r=fn(k);if(r!==null)d2[r]=S.due[k]});S.due=d2}
 S.rec=(S.rec||[]).map(r=>{const c=fn(r.c);return c===null?null:Object.assign({},r,{c})}).filter(Boolean)}
function renameLine(g,old,raw){const n=clean(raw),i=S.g[g].indexOf(old);if(!n||n===old||i<0){draw();return}
 if(exists(n)&&n.toLowerCase()!==old.toLowerCase()){alert("Ce nom existe déjà.");draw();return}
 S.g[g][i]=n;remap(x=>x===old?n:x);save();draw()}
function retireLine(g,n){
 const M=typeof lastM==="number"?lastM:(S.year===new Date().getFullYear()?new Date().getMonth():0);
 if(g==="sav"||g==="pot"){const b=M>0?(g==="sav"?soldeSav(M-1,n):soldePot(M-1,n)):op(g,n);
  if(Math.abs(b)>0.005){alert("Le solde de « "+n+" » n'est pas à zéro ("+eur(b)+") au début de "+MOIS[M]+". Videz-le ou ajustez-le d'abord (retrait, ajustement), puis retirez la ligne.");return}}
 if(!confirm("Retirer « "+n+" » à partir de "+MOIS[M]+" "+S.year+" ?\n\nLes mois précédents gardent ses montants. La ligne disparaît d'ici à la fin (et des années suivantes).\n\nPour la retirer à partir d'un autre mois, ouvrez d'abord ce mois puis revenez dans Réglages.\nElle reste récupérable dans « Lignes retirées »."))return;
 stash();const cut=(d,from)=>{Object.keys(d.m||{}).forEach(mm=>{if(+mm>=from)Object.keys(d.m[mm]).forEach(k=>{if(k.slice(k.indexOf("|")+1)===n)delete d.m[mm][k]})});
  d.tx=(d.tx||[]).filter(t=>!(t.c===n&&t.m>=from));d.ret=(d.ret||[]).filter(t=>!(t.c===n&&(t.m==null||t.m>=from)));
  Object.keys(d.ap||{}).forEach(k=>{const i=k.indexOf("|");if(k.slice(i+1)===n&&+k.slice(0,i)>=from)delete d.ap[k]})};
 const cur0={m:S.m,tx:S.tx,ret:S.ret,ap:S.ap};cut(cur0,M);S.tx=cur0.tx;S.ret=cur0.ret;
 Object.keys(S.yrs||{}).forEach(y=>{if(+y>S.year){const d=S.yrs[y];cut(d,0);Object.keys(d.open||{}).forEach(k=>{if(k.slice(k.indexOf("|")+1)===n)delete d.open[k]})}});
 S.end=S.end||{};S.end[n]=S.year*100+M;if(S.due)delete S.due[n];S.rec=(S.rec||[]).filter(r=>r.c!==n);
 stash();save();draw()}
function delLine(g,n,hard){if(!hard){retireLine(g,n);return}if(!confirm("Supprimer définitivement « "+n+" » et TOUT son historique (toutes les années) ?"))return;S.g[g]=S.g[g].filter(x=>x!==n);remap(x=>x===n?null:x);save();draw()}
function moveLine(g,i,d){const a=S.g[g],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();draw()}
function saveGoal(id,f){const fd=new FormData(f),p=String(fd.get("month")||"").split("-");if(p.length<2)return;
 const g={id:id==="new"?String(Date.now()):id,name:clean(fd.get("name"))||"Objectif",t:+fd.get("t")||0,y:+p[0],m:+p[1]-1,lines:fd.getAll("l")};
 const i=S.goals.findIndex(x=>x.id===id);if(i>=0)S.goals[i]=g;else S.goals.push(g);save();draw()}
function exportJson(){setMeta({lastBackup:Date.now()});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(pack())],{type:"application/json"}));a.download="budget-"+S.year+".json";a.click()}
// Conversion d'un export de l'ancienne application personnelle (budget2026.json) vers ce format
function fromPersonal(o){
 const G0={inc:["Reste du mois précédent","Salaire Léa","Salaire Eva","Bonus","Études","Remboursements"],
  fix:["Appart 1","Appart 2","LOA Clio","Charges","Électricité","Orange","Prixtel","Canal +","Spotify","Disney","iCloud","Darty Max","Sport","Ass habitation","Ass CLIO","Ass Clio 6","Ass CACI Léa","Ass CACI Eva","Mutuelle Léa","Mutuelle Eva","Prév Léa","Prév Eva","Taxe foncière","Impôts","Frais bancaires","Predica","Juridique","Brossettes"],
  env:["Courses","Transports","Loisirs","Vacances","Divers","Maison","Santé","Shopping"],
  pot:["Noël","Animaux","Anniversaires","Casper","Argent de poche Eva","Argent de poche Léa"],
  sav:["Coups durs","Vacances","Travaux","Livret jeune","PER Léa","PER Eva","Ass Vie Léa","Ass Vie Eva"]};
 const g={};for(const k in G0){const l=o.lay&&Array.isArray(o.lay[k])?o.lay[k]:G0[k].concat(((o.cats||{})[k]||[]).filter(x=>!G0[k].includes(x)));g[k]=l.filter(x=>typeof x==="string")}
 const has=(a,n)=>ALL.some(m=>o[m]&&typeof o[m]==="object"&&+o[m][a+"|"+n]);
 if(!g.fix.includes("Free")&&(has("fix","Free")||has("pre","Free")))g.fix.push("Free");
 const m={};ALL.forEach(k=>{const x=o[k];if(x&&typeof x==="object"&&!Array.isArray(x)){m[k]={};for(const q in x)if(q.includes("|"))m[k][q]=x[q]}});
 const ach=Array.isArray(o.ach)?o.ach:["PER Léa","PER Eva","Ass Vie Léa","Ass Vie Eva"];
 const GD={"Coups durs":{t:6000,y:2028,m:1},"Vacances":{t:1500,y:2027,m:5},"Achat maison":{t:35000,y:2035,m:5}};
 const goals=(Array.isArray(o.glist)?o.glist:Object.keys(GD)).map((n,i)=>{const x=Object.assign({},GD[n],(o.goals||{})[n]);return{id:"p"+i,name:n,t:+x.t||0,y:+x.y,m:+x.m,lines:(n==="Achat maison"?ach:[n]).filter(a=>g.sav.includes(a))}}).filter(x=>x.lines.length&&x.y);
 const yr=+o.year||2026,arr=a=>(Array.isArray(a)?a:[]).filter(t=>t&&typeof t==="object");
 return Object.assign(DEF(),{title:o.title||("Budget "+yr),year:yr,carry:false,nobal:g.pot.filter(n=>n.startsWith("Argent de poche")),g,m,tx:arr(o.tx),ret:arr(o.ret),open:o.open&&typeof o.open==="object"?o.open:{},goals})}
const isPersonal=o=>!o.g&&!o.m&&(o.tx||o.cats||o.lay||ALL.some(k=>o[k]&&typeof o[k]==="object"));
function importJson(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{let msg="";try{
  let o;try{o=JSON.parse(String(r.result).replace(/^\uFEFF/,""))}catch(e){msg="Ce fichier n'est pas un JSON valide.";throw e}
  if(!o||typeof o!=="object"||Array.isArray(o)){msg="Format non reconnu (le fichier ne contient pas un budget).";throw 0}
  let conv=false;
  if(!o.g||(!o.m&&!o.yrs)){if(!isPersonal(o)){msg="Format non reconnu : ni un export de cette application, ni un export de l'ancienne application personnelle.";throw 0}
   try{o=fromPersonal(o);conv=true}catch(e){msg="Erreur pendant la conversion : "+(e&&e.message||e);throw e}}
  if(!confirm((conv?"Export de l'ancienne application personnelle détecté : il sera converti. ":"")+"Remplacer les données actuelles par celles du fichier ?")){inp.value="";return}
  const nn=normalize(o);nn.updated=Date.now();store.setItem(KEY,JSON.stringify(pack(nn)));location.reload()}
  catch(e){alert(msg||"Import impossible : "+(e&&e.message||e));inp.value=""}};r.readAsText(f)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset,a=d.act;
 if(a==="go")go(/^\d+$/.test(d.v)?+d.v:d.v);
 else if(a==="sec")goSec(d.id);
 else if(a==="pay"){const m=+d.m,p=pre(m,d.n),r=v(m,"fix",d.n);M(m)["fix|"+d.n]=p>0&&Math.abs(r-p)<.005?"":p;save();draw()}
 else if(a==="copyprev"){const m=+d.m;vis("fix",m).forEach(n=>{const p=pre(m-1,n);if(p&&!pre(m,n))M(m)["pre|"+n]=p});save();draw()}
 else if(a==="home")go("home");

 else if(a==="mkrec")mkRec(+d.i);

 else if(a==="csvb")shareCsv(csvBudget(),"budget-"+fmtD(new Date())+".csv")

 else if(a==="unretire"){delete S.end[d.n];save();draw()}
 else if(a==="up")moveLine(d.g,+d.i,-1);
 else if(a==="down")moveLine(d.g,+d.i,1);

 else if(a==="exp")exportJson();
 else if(a==="lockset")lockSetup(null);
 else if(a==="lockchange")verifyThen("Changer le code",()=>lockSetup(getLock()));

 else if(a==="biooff"){const L=getLock();L.bio=null;setLock(L);draw()}
 else if(a==="files")saveToFiles();
 else if(a==="gconnect")gToken().then(()=>{setMeta({gd:true,base:0});syncNow(true)}).catch(gFail);
 else if(a==="gsync"){if(tokenValid())syncNow(true);else connectThenSync()}
 else if(a==="gdisc"){if(confirm("Se déconnecter de Google Drive ? La copie déjà présente dans votre Drive n'est pas supprimée."))gDisconnect()}

 else if(a==="imp")document.getElementById("imp").click();
 else if(a==="wipe"){if(confirm("Effacer toutes vos données sur cet appareil ? Pensez à exporter d'abord. La copie Google Drive éventuelle n'est pas supprimée, et la synchronisation sera désactivée.")){store.removeItem(KEY);store.removeItem(MK);store.removeItem(LK);location.reload()}}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.fq==="q"){fq.q=t.value;const r=document.getElementById("txres");if(r)r.innerHTML=txRes()}});

 else if(d.form==="addrec")addRec(fd);

 else if(d.form==="addret"){S.ret.push({m:+d.m,d:fd.get("d"),c:fd.get("c"),a:+fd.get("a"),n:String(fd.get("n")||"").trim()});save();draw()}

const MK=KEY+"_meta",SCOPE="https://www.googleapis.com/auth/drive.appdata",FN="budget-sync.json";
const DR="https://www.googleapis.com/drive/v3/files",UP="https://www.googleapis.com/upload/drive/v3/files";
let gState="idle",gMsg="",gBusy=false,gAgain=false,gTimer;
function getMeta(){try{return JSON.parse(store.getItem(MK)||"{}")||{}}catch(e){return{}}}
function setMeta(p){try{store.setItem(MK,JSON.stringify(Object.assign(getMeta(),p)))}catch(e){}}
const fmtDT=ms=>new Date(ms).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
const tokenValid=()=>{const m=getMeta();return !!m.tok&&Date.now()<(m.exp||0)-60000};
function gSet(st,msg){gState=st;gMsg=msg||"";renderSync()}
function gFail(e){gSet(e&&e.message==="offline"?"err":"auth",e&&e.message==="offline"?"Hors connexion.":"Connexion à Google impossible (fenêtre bloquée ou refusée). Réessayez.")}
function connectThenSync(){gToken().then(()=>syncNow(true)).catch(gFail)}
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();
 const t=document.getElementById("gis");if(t){t.addEventListener("load",()=>res());t.addEventListener("error",()=>rej(new Error("offline")));return}
 const e=document.createElement("script");e.id="gis";e.src="https://accounts.google.com/gsi/client";e.onload=()=>res();e.onerror=()=>{e.remove();rej(new Error("offline"))};document.head.appendChild(e)})}
function gToken(){if(tokenValid())return Promise.resolve(getMeta().tok);
 return loadGIS().then(()=>new Promise((res,rej)=>{
  const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPE,
   callback:r=>{if(!r||r.error)return rej(new Error("auth"));setMeta({tok:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000});res(r.access_token)},
   error_callback:()=>rej(new Error("auth"))});
  c.requestAccessToken({prompt:""})}))}
async function gfetch(url,opt){const t=await gToken();
 const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+t},(opt||{}).headers||{})}));
 if(r.status===401){setMeta({tok:"",exp:0});throw new Error("auth")}
 if(!r.ok)throw new Error("Google Drive a répondu "+r.status+".");return r}
async function gFind(){const r=await gfetch(DR+"?spaces=appDataFolder&pageSize=1&fields="+encodeURIComponent("files(id,modifiedTime)")+"&q="+encodeURIComponent("name='"+FN+"' and trashed=false"));const j=await r.json();return j.files&&j.files[0]||null}
async function gGet(id){return (await gfetch(DR+"/"+id+"?alt=media")).json()}
async function gPut(id,body){
 if(id){await gfetch(UP+"/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body});return id}

function spentPct(m){const t=tot(m),base=t.i+t.c-t.s-t.p;return base>0?(t.d/base)*100:0}
let alertTimer=0;
function showAlert(l,pct){const A=ALERTS[l],msg=A.m[Math.floor(Math.random()*A.m.length)];
 let box=document.getElementById("alertbox");if(!box){box=document.createElement("div");box.id="alertbox";box.setAttribute("role","status");box.setAttribute("aria-live","polite");document.body.appendChild(box)}
 box.innerHTML=`<button type="button" class="alertc" style="border-left-color:${A.c}" aria-label="Fermer l'alerte"><b>${l} % du budget</b><span>${msg}</span><small>Dépensé ce mois : ${Math.round(pct)} % · touche pour fermer</small></button>`;
 box.className="on";clearTimeout(alertTimer);const close=()=>{box.className="";clearTimeout(alertTimer)};
 box.firstChild.onclick=close;alertTimer=setTimeout(close,9000);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function budgetAlert(){if(S.noalert||isLocked()||typeof cur!=="number")return;const n=new Date();if(S.year!==n.getFullYear()||cur!==n.getMonth())return;
 const pct=spentPct(cur),lvl=[98,90,85].find(x=>pct>=x)||0,k="al|"+S.year+"|"+cur,meta=getMeta(),al=meta.alerts||{},prev=al[k]||0;
 if(lvl===prev)return;al[k]=lvl;setMeta({alerts:al});if(lvl>prev)showAlert(lvl,pct)}

// ───────── Recherche dans les dépenses ─────────
let fq={q:"",c:"",y:"all",m:""};
const nz=s=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function txAll(){stash();const out=[];Object.keys(S.yrs).forEach(y=>{(S.yrs[y].tx||[]).forEach(t=>out.push({y:+y,m:t.m,d:t.d||"",c:t.c,a:+t.a||0,n:t.n||"",r:!!t.r}))});return out}
function txRes(){const q=nz(fq.q);let L=txAll().filter(t=>(fq.y==="all"||t.y===+fq.y)&&(fq.m===""||t.m===+fq.m)&&(!fq.c||t.c===fq.c)&&(!q||nz(t.n).includes(q)||nz(t.c).includes(q)||String(t.a).replace(".",",").includes(q)||String(t.a).includes(q)));
 L.sort((a,b)=>(b.d||(b.y+"-"+pad(b.m+1)+"-00")).localeCompare(a.d||(a.y+"-"+pad(a.m+1)+"-00")));
 const tot=L.reduce((a,t)=>a+t.a,0),shown=L.slice(0,300);
 return`<div class="hl" style="margin:10px 0"><b>${L.length}</b> dépense${L.length>1?"s":""} · total <b>${eur(tot)}</b>${L.length>300?" (300 premières affichées)":""}</div>`+(shown.length?shown.map(t=>`<button type="button" class="row txr" data-act="gotx" data-y="${t.y}" data-m="${t.m}"><span>${t.d?t.d.slice(8)+"/"+t.d.slice(5,7)+"/"+t.d.slice(0,4):MC[t.m]+" "+t.y} · <b>${esc(t.c)}</b>${t.n?" · "+esc(t.n):""}${t.r?" ↻":""}</span><span>${eur(t.a)}</span></button>`).join(""):`<p class="note">Aucune dépense ne correspond.</p>`)}
function txPage(){const all=txAll(),ys=[...new Set(all.map(t=>t.y))].sort(),cs=[...new Set(all.map(t=>t.c))].sort((a,b)=>a.localeCompare(b));
 return`<button type="button" class="back" data-act="backtx">‹ Retour</button><div class="card"><h2>Rechercher une dépense</h2>
 <input type="search" data-fq="q" value="${esc(fq.q)}" placeholder="Mot, magasin, montant…" aria-label="Rechercher" style="width:100%;margin-bottom:8px">
 <div class="fqs"><select data-fq="c" aria-label="Catégorie"><option value="">Toutes catégories</option>${cs.map(c=>`<option${fq.c===c?" selected":""}>${esc(c)}</option>`).join("")}</select>
 <select data-fq="y" aria-label="Année"><option value="all">Toutes les années</option>${ys.map(y=>`<option value="${y}"${String(fq.y)===String(y)?" selected":""}>${y}</option>`).join("")}</select>
 <select data-fq="m" aria-label="Mois"><option value="">Tous les mois</option>${MOIS.map((n,i)=>`<option value="${i}"${fq.m!==""&&+fq.m===i?" selected":""}>${n}</option>`).join("")}</select></div>
 <div id="txres">${txRes()}</div></div>`}
// ───────── Tableur (CSV) ─────────
const GRP={inc:"Revenus",fix:"Factures",env:"Dépenses",pot:"Enveloppes",sav:"Épargne"};
const fnum=x=>String(Math.round(x*100)/100).replace(".",",");
const qcsv=s=>{s=String(s==null?"":s);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csvLine=a=>a.map(qcsv).join(";");
function csvBudget(){stash();const rows=[["Année","Mois","Groupe","Ligne","Type","Montant"]];
 Object.keys(S.yrs).map(Number).sort().forEach(y=>{const d=S.yrs[y];
  Object.keys(d.open||{}).forEach(k=>{const i=k.indexOf("|"),g=k.slice(0,i),n=k.slice(i+1),x=+d.open[k];if((g==="sav"||g==="pot")&&x&&S.g[g].includes(n))rows.push([y,"Départ",GRP[g],n,"Solde de départ",fnum(x)])});
  for(let m=0;m<12;m++){const o=(d.m||{})[m]||{};
   const add=(g,pf,type)=>S.g[g].forEach(n=>{const x=+o[pf+"|"+n];if(x)rows.push([y,MOIS[m],GRP[g],n,type,fnum(x)])});
   add("inc","inc","Réel");add("fix","pre","Prévu");add("fix","fix","Payé");add("env","bud","Budget");add("pot","pot","Versé");add("pot","adjpot","Ajustement");add("sav","sav","Versé");add("sav","adjsav","Ajustement");
   S.g.sav.forEach(n=>{const r=(d.ret||[]).filter(t=>t.m===m&&t.c===n).reduce((a,t)=>a+t.a,0);if(r)rows.push([y,MOIS[m],"Épargne",n,"Retrait",fnum(r)])})}});
 return rows.map(csvLine).join("\r\n")}
function csvTx(){const rows=[["Année","Date","Mois","Catégorie","Montant","Note"]];
 txAll().sort((a,b)=>(a.y-b.y)||(a.m-b.m)||a.d.localeCompare(b.d)).forEach(t=>rows.push([t.y,t.d,MOIS[t.m],t.c,fnum(t.a),t.n]));return rows.map(csvLine).join("\r\n")}
async function shareCsv(text,name){const blob=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});
 try{const f=new File([blob],name,{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function parseCSV(t){t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0],sep=[";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
 const rows=[];let row=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===sep){row.push(f);f=""}
  else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
 if(f!==""||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==""))}
const pnum=s=>{s=String(s==null?"":s).replace(/[\s €]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const x=parseFloat(s);return isNaN(x)?null:x};
const pmonth=x=>{x=nz(x);if(!x)return null;if(/^\d+$/.test(x)){const n=+x;return n>=1&&n<=12?n-1:null}if(x==="depart")return"open";
 const c=MOIS.map(nz);let i=c.indexOf(x);if(i>=0)return i;const k=c.map((v,j)=>v.startsWith(x)?j:-1).filter(j=>j>=0);return x.length>=3&&k.length===1?k[0]:null};
const GKEY={revenus:"inc",revenu:"inc",factures:"fix",facture:"fix",depenses:"env",depense:"env",enveloppes:"pot",enveloppe:"pot",epargne:"sav"};
function keyFor(g,t){t=nz(t);
 if(t==="solde de depart"||t==="depart")return(g==="sav"||g==="pot")?"open":null;
 if(g==="inc")return"inc";
 if(g==="fix")return t==="prevu"?"pre":(t==="paye"||t==="reel")?"fix":null;
 if(g==="env")return(t==="budget"||t==="prevu")?"bud":null;
 if(g==="pot")return t==="ajustement"?"adjpot":(t==="verse"||t==="reel"||t==="budget")?"pot":null;
 if(g==="sav")return t==="ajustement"?"adjsav":t==="retrait"?"ret":(t==="verse"||t==="reel")?"sav":null;return null}
const iso=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
function parseDate(x){x=String(x||"").trim();let m=x.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return{y:+m[1],m:+m[2]-1,d:x.slice(0,10)};m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return{y:+m[3],m:+m[2]-1,d:iso(+m[3],+m[2]-1,+m[1])};return null}
function importCsv(file){const rd=new FileReader();rd.onload=()=>{try{
 const rows=parseCSV(String(rd.result||""));if(rows.length<2)throw new Error("Le fichier est vide.");
 const H=rows[0].map(nz),ix=n=>H.findIndex(h=>h===n),body=rows.slice(1);
 if(ix("groupe")>=0&&ix("ligne")>=0&&ix("montant")>=0)importBudgetCsv(H,body);
 else if(ix("categorie")>=0&&ix("montant")>=0&&(ix("date")>=0||ix("mois")>=0))importTxCsv(H,body);
 else throw new Error("Colonnes non reconnues. Attendu : « Année ; Mois ; Groupe ; Ligne ; Type ; Montant » (budget) ou « Année ; Date ; Mois ; Catégorie ; Montant ; Note » (dépenses).")}
 catch(e){alert("Import impossible : "+e.message)}};
 rd.onerror=()=>alert("Lecture du fichier impossible.");rd.readAsText(file,"utf-8")}
function importBudgetCsv(H,body){const c=n=>H.indexOf(n),ci={y:c("annee"),m:c("mois"),g:c("groupe"),l:c("ligne"),t:c("type"),a:c("montant")};
 const items=[],bad=[];
 body.forEach((r,i)=>{const y=parseInt(r[ci.y],10),m=pmonth(r[ci.m]),g=GKEY[nz(r[ci.g])],n=clean(r[ci.l]),k=g?keyFor(g,ci.t>=0?r[ci.t]:"reel"):null,a=pnum(r[ci.a]);
  if(!(y>=2000&&y<=2100)||m===null||!g||!n||!k||a===null){bad.push(i+2);return}
  if(k!=="open"&&m==="open"){bad.push(i+2);return}
  items.push({y,m,g,n,k,a})});
 if(!items.length)throw new Error("Aucune ligne exploitable"+(bad.length?" (lignes ignorées : "+bad.slice(0,8).join(", ")+")":"")+".");
 const years=[...new Set(items.map(x=>x.y))].sort();
 if(!confirm("Importer "+items.length+" montant"+(items.length>1?"s":"")+" pour "+years.join(", ")+" ?\n\nLes cases présentes dans le fichier remplacent celles de l'application ; tout le reste est conservé."+(bad.length?"\n"+bad.length+" ligne(s) illisible(s) seront ignorées.":"")+"\n\nAstuce : exportez d'abord une sauvegarde."))return;
 const y0=S.year;stash();let added=0,skipped=0;
 try{years.forEach(y=>{loadYear(y);
  items.filter(x=>x.y===y).forEach(x=>{
   const inG=S.g[x.g].includes(x.n);
   if(!inG){if(exists(x.n)){skipped++;return}S.g[x.g].push(x.n);added++}
   if(x.k==="open"){S.open[x.g+"|"+x.n]=x.a}
   else if(x.k==="ret"){S.ret=S.ret.filter(t=>!(t.m===x.m&&t.c===x.n&&t.n==="Import CSV"));S.ret.push({m:x.m,d:iso(y,x.m,1),c:x.n,a:x.a,n:"Import CSV"})}
   else M(x.m)[x.k+"|"+x.n]=x.a});
  stash()})}
 finally{loadYear(y0)}
 save();nav();draw();alert("Import terminé : "+(items.length-skipped)+" montant(s) importé(s)"+(added?", "+added+" ligne(s) créée(s)":"")+(skipped?", "+skipped+" ignoré(s) (nom déjà utilisé dans un autre groupe)":"")+".")}
function importTxCsv(H,body){const c=n=>H.indexOf(n),ci={y:c("annee"),d:c("date"),m:c("mois"),c:c("categorie"),a:c("montant"),n:c("note")};
 const items=[];let bad=0,unk=new Set();
 body.forEach(r=>{const dt=ci.d>=0?parseDate(r[ci.d]):null,a=pnum(r[ci.a]),cat=clean(r[ci.c]);
  let y=ci.y>=0&&r[ci.y]!==""?parseInt(r[ci.y],10):(dt?dt.y:NaN),m=ci.m>=0&&r[ci.m]!==""?pmonth(r[ci.m]):(dt?dt.m:null);
  if(!(y>=2000&&y<=2100)||m===null||m==="open"||a===null||a<=0||!cat){bad++;return}
  if(!S.g.env.includes(cat)&&!S.g.pot.includes(cat)){unk.add(cat);bad++;return}
  items.push({y,m,d:dt?dt.d:"",c:cat,a,n:String(ci.n>=0?r[ci.n]:"").trim().slice(0,60)})});
 if(!items.length)throw new Error("Aucune dépense exploitable"+(unk.size?". Catégories inconnues : "+[...unk].slice(0,6).join(", ")+" (créez-les d'abord dans Réglages › Dépenses ou Enveloppes)":"")+".");
 const years=[...new Set(items.map(x=>x.y))].sort();
 if(!confirm("Importer "+items.length+" dépense"+(items.length>1?"s":"")+" ("+years.join(", ")+") ?\n\nLes dépenses déjà présentes à l'identique ne sont pas dupliquées."+(bad?"\n"+bad+" ligne(s) ignorée(s)"+(unk.size?" (catégories inconnues : "+[...unk].slice(0,4).join(", ")+")":"")+".":"")))return;
 const y0=S.year;stash();let n=0;
 try{years.forEach(y=>{loadYear(y);const have=new Map();S.tx.forEach(t=>{const k=[t.m,t.d||"",t.c,t.a,String(t.n||"").trim()].join("|");have.set(k,(have.get(k)||0)+1)});
  items.filter(x=>x.y===y).forEach(x=>{const k=[x.m,x.d,x.c,x.a,x.n].join("|");if(have.get(k)>0){have.set(k,have.get(k)-1);return}S.tx.push({m:x.m,d:x.d,c:x.c,a:x.a,n:x.n});n++});stash()})}
 finally{loadYear(y0)}
 save();nav();draw();alert("Import terminé : "+n+" dépense(s) ajoutée(s)"+(items.length-n?", "+(items.length-n)+" déjà présente(s)":"")+(bad?", "+bad+" ignorée(s)":"")+".")}
const CSV_MODEL="Année;Mois;Groupe;Ligne;Type;Montant\r\n2025;Août;Revenus;Salaire;Réel;1800,50\r\n2025;Août;Factures;Loyer;Prévu;700\r\n2025;Août;Factures;Loyer;Payé;700\r\n2025;Août;Dépenses;Courses;Budget;300\r\n2025;Août;Enveloppes;Cadeaux;Versé;40\r\n2025;Août;Épargne;Projet;Versé;100\r\n2025;Départ;Épargne;Projet;Solde de départ;1500\r\n";
